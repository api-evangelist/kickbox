summary: >-
  Kickbox operates a trust center at trust.kickbox.com, linked from its own Security and Compliance
  documentation page with deep links into five control categories. The page itself is a JavaScript
  single-page application and renders no server-side text, so the certification list below is taken
  from Kickbox's documentation and pricing page rather than scraped from the trust center — the
  mechanical probe (0-working/probe-security-programs.py) returned no hit for exactly that reason.
control_categories:
  - {name: Infrastructure security, url: 'https://trust.kickbox.com/controls#infrastructure-security'}
  - {name: Organizational security, url: 'https://trust.kickbox.com/controls#organizational-security'}
  - {name: Product security, url: 'https://trust.kickbox.com/controls#product-security'}
  - {name: Internal security procedures, url: 'https://trust.kickbox.com/controls#internal-security-procedures'}
  - {name: Data and privacy, url: 'https://trust.kickbox.com/controls#data-and-privacy'}
certifications:
  - name: SOC 2
    status: claimed
    note: >-
      Kickbox makes two different claims about SOC 2 and both are recorded here rather than
      reconciled. The docs page (Security and Compliance) invites readers to "view our current
      progress towards SOC2 compliance" on the trust center, which reads as in-progress. The pricing
      page states Kickbox "is fully GDPR-compliant and SOC II certified". No audit report or
      attestation date is published on either page, so the status is recorded as claimed.
    sources:
      - https://docs.kickbox.com/docs/security-and-compliance
      - https://kickbox.com/pricing
  - name: GDPR
    status: claimed-compliant
    note: >-
      "We are GDPR compliant, following all of the EU's regulations for data protection for our EU
      customers." Kickbox operates dedicated EU verification servers and a separate EU application
      (app.eu.kickbox.com / api.eu.kickbox.com).
    docs: https://docs.kickbox.com/docs/gdpr
    sources: [https://docs.kickbox.com/docs/security-and-compliance]
  - name: CCPA
    status: claimed-ready
    note: Documented as "CCPA and GDPR ready".
    sources: [https://docs.kickbox.com/docs/security-and-compliance]
memberships:
  - name: M3AAWG
    note: >-
      Documented as membership in anti-abuse organizations "like M3WAGG" (the provider's own spelling
      of M3AAWG, the Messaging, Malware and Mobile Anti-Abuse Working Group). Recorded verbatim from
      the source with the intended organization noted.
    sources: [https://docs.kickbox.com/docs/security-and-compliance]
data_handling:
  - >-
    Kickbox states it does not send email to verify addresses and does not accept customers who use
    their lists for spam.
  - >-
    EU customers can have verifications processed on dedicated EU servers.
