apis:
- aid: kickbox:verification-api
  name: Kickbox Email Verification API
  description: >-
    REST API for verifying the deliverability of email addresses in real time. Returns a result (deliverable,
    undeliverable, risky, unknown), a reason code, plus flags for role addresses, disposable domains,
    and free email providers. Authentication uses an API key supplied as a query string parameter or in
    the Authorization header. Sandbox mode is available for testing without consuming credits.
  humanURL: https://docs.kickbox.com
  baseURL: https://api.kickbox.com/v2
  tags:
  - Email Verification
  - Deliverability
  - Validation
