note: >-
  Kickbox publishes four first-party client libraries (Node.js, PHP, Python, Ruby) from the
  github.com/kickboxio organization, plus a curated list of community-contributed libraries on the
  same docs page. Versions and publication dates below were read from each registry's own metadata
  endpoint on 2026-08-13. Every first-party SDK is materially stale relative to the live API: the
  Node.js library was last published in 2018, Python in 2020, Ruby in 2021 and PHP in 2023, while the
  docs describe API behaviour (Bearer auth, sandbox key prefixes, did_you_mean, spike alerts) that
  post-dates most of those releases.
