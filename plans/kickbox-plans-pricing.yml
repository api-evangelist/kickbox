summary: >-
  Kickbox does not sell subscription tiers. It sells prepaid verification credits on a single
  published volume ladder that applies to every account, with the unit price falling as volume rises
  (from $0.010 per verification at 500 addresses to $0.003 at 1,000,000). The first 100 verifications
  are free. Volume above 1,000,000 leaves the published ladder and is quoted as enterprise pricing.
  All accounts get the same feature set — there is no feature gating between tiers — so the ladder
  below is a price schedule rather than a set of plans.
