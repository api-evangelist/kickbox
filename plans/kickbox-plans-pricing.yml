overage: >-
  Not applicable — the model is prepaid, so verification stops when the credit balance is exhausted
  rather than accruing overage. The API returns HTTP 403 with {"success": false, "message":
  "Insufficient balance"} at zero balance, and Kickbox recommends enabling auto-recharge to avoid it.
auto_recharge:
